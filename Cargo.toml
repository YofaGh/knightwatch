[workspace]
members = [
    "crates/knightwatch",
    "crates/knightwatch-cli",
    "crates/knightwatch-tui",
    "crates/kw-types",
    "crates/kw-utils",
]
default-members = ["crates/knightwatch"]
resolver = "2"

[workspace.dependencies]
base64 = "0.22.1"
bollard = "0.21.0"
clap = { version = "4.5.59", features = ["derive", "env"] }
directories = "6.0.0"
nvml-wrapper = "0.12.1"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
starship-battery = "0.11.0"
sysinfo = "0.38.2"
tokio = { version = "1.49.0", features = ["full"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

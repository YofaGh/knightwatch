[package]
name = "knightwatch-cli"
version = "1.0.3"
edition = "2024"
authors = ["YofaGh"]
description = "CLI client for Knightwatch"
homepage = "https://github.com/YofaGh/knightwatch"
repository = "https://github.com/YofaGh/knightwatch"
license = "MIT"

[[bin]]
name = "kwctl"
path = "src/main.rs"

[package.metadata.wix]
upgrade-guid = "16227121-66F5-4BDB-B2AA-16A3E9046720"
path-guid = "7B1159E0-79F3-48CF-8256-3E59C1C60C2F"
license = false
eula = false

[dependencies]
base64 = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
kw-types = { path = "../kw-types" }
kw-clients = { path = "../kw-clients" }
rustyline = { version = "18.0.1", features = ["derive"] }
shlex = "2.0.1"

[lints]
workspace = true

[package]
name = "knightwatch"
version = "1.0.4"
edition = "2024"

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "dep:axum",
    "dep:base64",
    "dep:battery",
    "dep:chrono",
    "dep:clap",
    "dep:directories",
    "dep:image",
    "dep:nvml-wrapper",
    "dep:reqwest",
    "dep:sysinfo",
    "dep:teloxide",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:xcap",
    "dep:leptos_axum",
    "dep:leptos_config",
    "dep:procfs",
    "dep:windows",
    "dep:rust-embed",
    "dep:mime_guess",
]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen"]

[dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

axum = { version = "=0.8.8", features = ["macros"], optional = true }
base64 = { version = "0.22.1", optional = true }
battery = { version = "0.7.8", optional = true }
chrono = { version = "0.4.43", features = ["serde"], optional = true }
clap = { version = "4.5.59", features = ["derive"], optional = true }
directories = { version = "6.0.0", optional = true }
image = { version = "0.25.9", features = ["jpeg", "png"], optional = true }
leptos_axum = { version = "0.8", optional = true }
leptos_config = { version = "0.8", optional = true }
mime_guess = { version = "2.0.5", optional = true }
nvml-wrapper = { version = "0.12.1", optional = true }
reqwest = { version = "0.13.2", features = ["json"], optional = true }
rust-embed = { version = "8.11.0", optional = true }
sysinfo = { version = "0.38.2", optional = true }
teloxide = { version = "0.17.0", features = ["macros"], optional = true }
tokio = { version = "1.49.0", features = ["full"], optional = true }
tokio-util = { version = "0.7.18", features = ["rt"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
xcap = { version = "0.9.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
], optional = true }

[lib]
name = "knightwatch"
path = "src/lib.rs"
crate-type = ["rlib"]
